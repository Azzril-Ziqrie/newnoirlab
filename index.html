<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noirlab Collective - Home</title>
    <link rel="stylesheet" href="global.css">
    <style>
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding-bottom: 60px;
        }

        .page-title {
            font-size: clamp(3rem, 7vw, 6.5rem);
            font-weight: 400;
            letter-spacing: -1.5px;
            margin: 30px 0 50px 0;
            text-align: center;
        }

        .hero-container {
            width: 100%;
            max-width: 1400px;
            padding: 0 40px;
        }

        .hero-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 24px;
            object-fit: cover;
        }

        @media (max-width: 900px) {
            .page-title {
                margin: 20px 0 30px 0;
                letter-spacing: -0.5px;
            }
            .hero-container { padding: 0 20px; }
            .hero-container img { border-radius: 16px; }
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <main>
        <h1 class="page-title">Noirlab Collective</h1>
        <div class="hero-container">
            <img src="assets/gif/hero.gif" alt="Noirlab Live Performance">
        </div>
    </main>

    <script src="navbar.js"></script>
</body>
</html>
