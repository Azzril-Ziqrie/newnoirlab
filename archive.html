<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noirlab Collective - Archive</title>
    <link rel="stylesheet" href="global.css">
    <style>
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding-bottom: 60px;
        }

        .page-title {
            font-size: clamp(3rem, 7vw, 6.5rem);
            font-weight: 400;
            letter-spacing: -1.5px;
            margin: 20px 0 40px 0;
            text-align: center;
        }

        .archive-container {
            width: 100%;
            max-width: 1400px;
            padding: 0 40px;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            width: 100%;
        }

        .grid-item {
            aspect-ratio: 1 / 1;
            background-color: #b8b8b8;
            border-radius: 16px;
            overflow: hidden;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @media (max-width: 1200px) {
            .image-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 16px;
            }
        }

        @media (max-width: 900px) {
            .page-title { margin: 20px 0 30px 0; letter-spacing: -0.5px; }
            .archive-container { padding: 0 20px; }
            .image-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
        }

        @media (max-width: 600px) {
            .image-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <main>
        <h1 class="page-title">Archive</h1>
        <div class="archive-container"> 
            <div class="image-grid">
            <div class="grid-item"><img src="assets/images/image1.jpg" alt="Gallery image 1"></div>
            <div class="grid-item"><img src="assets/images/image2.jpg" alt="Gallery image 2"></div>
            <div class="grid-item"><img src="assets/images/image3.jpg" alt="Gallery image 3"></div>
            <div class="grid-item"><img src="assets/images/image4.jpg" alt="Gallery image 4"></div>
            <div class="grid-item"><img src="assets/images/image5.jpg" alt="Gallery image 5"></div>
            <div class="grid-item"><img src="assets/images/image6.jpg" alt="Gallery image 6"></div>
            <div class="grid-item"><img src="assets/images/image7.jpg" alt="Gallery image 7"></div>
            <div class="grid-item"><img src="assets/images/image8.jpg" alt="Gallery image 8"></div>
            <div class="grid-item"><img src="assets/images/image9.jpg" alt="Gallery image 9"></div>
            <div class="grid-item"><img src="assets/images/image10.jpg" alt="Gallery image 10"></div>
            <div class="grid-item"><img src="assets/images/image11.jpg" alt="Gallery image 11"></div>
            <div class="grid-item"><img src="assets/images/image12.jpg" alt="Gallery image 12"></div>
            div>
        </div>

        
    </main>



    <script src="navbar.js"></script>
</body>
</html>
