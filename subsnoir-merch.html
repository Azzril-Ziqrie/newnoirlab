<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noirlab Collective - Subsnoir Merch</title>
    <link rel="stylesheet" href="global.css">
    <style>
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding-bottom: 60px;
        }

        .page-title {
            font-size: clamp(3rem, 7vw, 6.5rem);
            font-weight: 400;
            letter-spacing: -1.5px;
            margin: 20px 0 40px 0;
            text-align: center;
        }

        .merch-container {
            width: 100%;
            max-width: 1400px;
            padding: 0 40px;
        }

         .merch-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 24px;
            object-fit: cover;
        }

        .merch-placeholder {
            width: 100%;
            height: 65vh;
            min-height: 500px;
            background-color: #b8b8b8;
            border-radius: 24px;
        }

        @media (max-width: 900px) {
            .page-title { margin: 20px 0 30px 0; letter-spacing: -0.5px; }
            .merch-container { padding: 0 20px; }
            .merch-placeholder { border-radius: 16px; height: 50vh; min-height: 300px; }
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <main>
        <h1 class="page-title">Subsnoir Merch</h1>
        <div class="merch-container">
            <img src="assets/gif/NICELAB.gif" alt="Noirlab Live Performance">
           
        </div>
    </main>

    <script src="navbar.js"></script>
</body>
</html>
